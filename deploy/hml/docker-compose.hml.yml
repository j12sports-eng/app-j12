name: j12-hml-isolated

services:
  mysql-hml:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - j12_hml_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    labels:
      com.j12.environment: homologation
      com.j12.disposable: "true"
    networks:
      - j12_hml_internal

volumes:
  j12_hml_mysql_data:
    labels:
      com.j12.environment: homologation
      com.j12.disposable: "true"

networks:
  j12_hml_internal:
    internal: true
